services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Controllers
    Freema\ReactAdminApiBundle\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']
        public: true

    # Request Providers
    Freema\ReactAdminApiBundle\Request\Provider\List\ListDataRequestProviderManager:
        public: true

    Freema\ReactAdminApiBundle\Request\Provider\List\RestProvider:
        tags:
            - { name: 'react_admin_api.list_data_request_provider' }

    Freema\ReactAdminApiBundle\Request\Provider\List\CustomProvider:
        tags:
            - { name: 'react_admin_api.list_data_request_provider' }

    # Request Factory
    Freema\ReactAdminApiBundle\Request\ListDataRequestFactory:
        public: true

    # Services
    Freema\ReactAdminApiBundle\Service\:
        resource: '../../Service/'

    # OpenAPI / TypeScript codegen (T12)
    Freema\ReactAdminApiBundle\OpenApi\OpenApiSchemaBuilder:
        arguments:
            $resourceConfiguration: '@Freema\ReactAdminApiBundle\Service\ResourceConfigurationService'

    Freema\ReactAdminApiBundle\Command\DumpOpenApiCommand:
        arguments:
            $schemaBuilder: '@Freema\ReactAdminApiBundle\OpenApi\OpenApiSchemaBuilder'
        tags: ['console.command']

    Freema\ReactAdminApiBundle\Command\DumpTypeScriptCommand:
        arguments:
            $resourceConfiguration: '@Freema\ReactAdminApiBundle\Service\ResourceConfigurationService'
        tags: ['console.command']
