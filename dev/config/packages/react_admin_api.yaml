react_admin_api:
    resources:
        # Simple mapping: resource path => DTO class
        # Everything else is derived automatically:
        # - Entity class from DTO->getMappedEntityClass()
        # - Repository from EntityManager->getRepository(entityClass)
        # - Available operations from implemented interfaces on repository
        users:
            dto_class: 'Freema\ReactAdminApiBundle\Dev\Dto\UserDto'
            # related_resources:
            #     posts:
            #         dto_class: 'App\Dto\PostDto'
            #         relationship_method: 'getPosts'
    data_provider:
        type: 'simple_rest'