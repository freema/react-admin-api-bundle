version: '3'

vars:
  COMPOSE_FILE: docker-compose.yml
  COMPOSE: docker compose
  CONTAINER_NAME: react-admin-api-bundle-app
  TEST_DIR: .symfony-test

tasks:
  # Docker Management
  up:
    desc: 'Start development environment'
    cmd: |
      {{ .COMPOSE }} up -d
    aliases: ['u']

  down:
    desc: 'Stop development environment'
    cmd: '{{ .COMPOSE }} down'
    aliases: ['d']

  restart:
    desc: 'Restart development environment'
    cmds:
      - task: down
      - task: up
    aliases: ['r']

  # Development Tasks
  php:shell:
    desc: 'Open shell in PHP container'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} sh'
    aliases: ['sh']

  dev:serve:
    desc: 'Start development server'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} php -S 0.0.0.0:8080 -t dev/'
    aliases: ['serve']

  composer:install:
    desc: 'Install composer dependencies'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} composer install'
    aliases: ['install']

  composer:update:
    desc: 'Update composer dependencies'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} composer update'
    aliases: ['update']

  # Testing Different Symfony Versions, the way CI does: copy the bundle into
  # a scratch directory and let Symfony Flex restrict symfony/* to the
  # requested version
  test:prepare:
    desc: 'Copy the bundle into a scratch directory for a version test'
    cmds:
      - rm -rf {{ .TEST_DIR }}
      - mkdir -p {{ .TEST_DIR }}
      - cp -r src tests composer.json phpunit.xml.dist {{ .TEST_DIR }}/

  test:symfony:
    internal: true
    cmds:
      - task: test:prepare
      - >-
        {{ .RUNNER }} sh -c "composer global config --no-plugins allow-plugins.symfony/flex true
        && composer global require --quiet --no-interaction symfony/flex
        && SYMFONY_REQUIRE='{{ .SYMFONY }}' composer update --no-interaction --no-progress
        && vendor/bin/phpunit"

  test:symfony64:
    desc: 'Test with Symfony 6.4 (PHP 8.2 container)'
    cmds:
      - task: test:symfony
        vars:
          SYMFONY: '6.4.*'
          RUNNER: 'docker exec -w /app/{{ .TEST_DIR }} {{ .CONTAINER_NAME }}'
    aliases: ['t:64']

  test:symfony74:
    desc: 'Test with Symfony 7.4 (PHP 8.2 container)'
    cmds:
      - task: test:symfony
        vars:
          SYMFONY: '7.4.*'
          RUNNER: 'docker exec -w /app/{{ .TEST_DIR }} {{ .CONTAINER_NAME }}'
    aliases: ['t:74']

  test:symfony8:
    desc: 'Test with Symfony 8 (needs PHP 8.4+, runs in the composer:2 image)'
    cmds:
      - task: test:symfony
        vars:
          SYMFONY: '8.*'
          RUNNER: 'docker run --rm -v "{{ .ROOT_DIR }}":/app -w /app/{{ .TEST_DIR }} composer:2'
    aliases: ['t:8']

  test:all:
    desc: 'Test with all supported Symfony versions'
    cmds:
      - task: test:symfony64
      - task: test:symfony74
      - task: test:symfony8
    aliases: ['t:all']

  test:cleanup:
    desc: 'Clean test environment'
    cmd: rm -rf {{ .TEST_DIR }}
    aliases: ['t:clean']

  # Code Quality
  stan:
    desc: 'Run PHPStan analysis'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} vendor/bin/phpstan analyse'
    aliases: ['lint']

  cs:fix:
    desc: 'Fix code style'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} vendor/bin/php-cs-fixer fix'
    aliases: ['fix', 'fixer']

  test:
    desc: 'Run PHPUnit tests'
    cmd: 'docker exec -it {{ .CONTAINER_NAME }} vendor/bin/phpunit'
    aliases: ['t']
  
  # React Admin Development
  admin:dev:
    desc: 'Start React Admin development server'
    cmd: 'cd dev/admin-app && npm run dev'
    aliases: ['admin']

  admin:install:
    desc: 'Install React Admin dependencies'
    cmd: 'cd dev/admin-app && npm install'

  admin:build:
    desc: 'Build React Admin for production'
    cmd: 'cd dev/admin-app && npm run build'

  # Combined Development Tasks
  dev:
    desc: 'Start both API server and React Admin dev server'
    cmds:
      - 'docker exec -d {{ .CONTAINER_NAME }} php -S 0.0.0.0:8080 -t dev/'
      - task: admin:dev
    aliases: ['start']

  dev:with-assets:
    desc: 'Start development with assets watching'
    cmds:
      - task: assets:build
      - 'docker exec -d {{ .CONTAINER_NAME }} php -S 0.0.0.0:8080 -t dev/'
      - task: assets:watch &
      - task: admin:dev
    aliases: ['dev:assets']

  build:all:
    desc: 'Build everything for production'
    cmds:
      - task: assets:build
      - task: admin:build
    aliases: ['build']

  # Assets Management
  assets:install:
    desc: 'Install assets dependencies'
    cmd: 'cd assets && npm install'
    aliases: ['assets:i']

  assets:build:
    desc: 'Build assets for production'
    cmds:
      - task: assets:clean
      - cd assets && npm run build
    aliases: ['assets:b']

  assets:watch:
    desc: 'Watch assets for changes'
    cmd: 'cd assets && npm run watch'
    aliases: ['assets:w']

  assets:clean:
    desc: 'Clean assets dist folder'
    cmd: 'cd assets && npm run clean'
    aliases: ['assets:c']

  assets:lint:
    desc: 'Lint assets TypeScript files'
    cmd: 'cd assets && npm run lint'
    aliases: ['assets:l']

  assets:lint:fix:
    desc: 'Fix assets linting issues'
    cmd: 'cd assets && npm run lint:fix'
    aliases: ['assets:lf']

  assets:format:
    desc: 'Format assets TypeScript files'
    cmd: 'cd assets && npm run format'
    aliases: ['assets:f']

  assets:format:check:
    desc: 'Check assets formatting'
    cmd: 'cd assets && npm run format:check'
    aliases: ['assets:fc']

  # Setup task
  setup:
    desc: 'Setup project (start docker, install dependencies)'
    cmds:
      - task: up
      - task: composer:install
      - task: assets:install
    aliases: ['init']
  
  default:
    desc: 'Show available commands'
    cmds:
      - task --list