name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  test:
    name: Verify tests on tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, dom, filter, json
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpstan analyse src --level=5 --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpunit

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build changelog
        id: changelog
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prev=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -n1)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            if [ -n "$prev" ]; then
              echo "## Changes since ${prev}"
              echo
              git log --pretty='format:- %s (%h)' "${prev}..${tag}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              echo "Initial release ${tag}."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.changelog.outputs.tag }}" \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.body }}"
